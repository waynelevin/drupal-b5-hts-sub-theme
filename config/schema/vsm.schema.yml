# Schema for the configuration files of the VSM theme.

vsm.settings:
  # The Bootstrap 5 base theme's settings (b5_*), plus VSM's own.
  type: bootstrap5.settings
  label: 'VSM settings'
  mapping:
    bootswatch:
      type: string
      label: 'Bootswatch theme (zephyr by default, none for plain Bootstrap)'
    navbar_alignment:
      type: string
      label: 'Navbar menu alignment (left, center or right)'
    menu_icons:
      type: string
      label: 'Main menu icons, one "path|icon" per line'
    font:
      type: string
      label: 'Font (empty for the theme default)'
    table_striped:
      type: boolean
      label: 'Stripe table rows'
    table_row_padding:
      type: string
      label: 'Table row top and bottom padding (empty for the Bootswatch theme default)'
    # The base theme's settings form saves its "Subtheme" generator fields
    # with the other settings; they are not used by VSM.
    subtheme_folder:
      type: string
      label: 'Bootstrap 5 subtheme generator: folder'
    subtheme_name:
      type: string
      label: 'Bootstrap 5 subtheme generator: name'
    subtheme_machine_name:
      type: string
      label: 'Bootstrap 5 subtheme generator: machine name'
